name: Update Homebrew Formula

on:
  push:
    branches:
      - main
    paths:
      - Formula/euer.rb
      - Formula/euer-datev.rb
      - scripts/update_formula.py
      - .github/workflows/update-formula.yml
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: homebrew-formula-update
  cancel-in-progress: false

jobs:
  prepare:
    name: PyPI-Versionen auflösen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        run: git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" .
      - name: Formulas aus PyPI aktualisieren
        run: |
          python3 scripts/update_formula.py Formula/euer.rb
          python3 scripts/update_formula.py Formula/euer-datev.rb
      - name: Geprüfte Kandidaten speichern
        uses: actions/upload-artifact@v4
        with:
          name: updated-formulae
          path: Formula/*.rb
          if-no-files-found: error

  test:
    name: Formula prüfen (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Repository auschecken
        run: git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" .

      - name: Formulas des Vorbereitungsschritts übernehmen
        uses: actions/download-artifact@v4
        with:
          name: updated-formulae
          path: Formula

      - name: Homebrew bereitstellen (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      - name: Lokale Tap-Arbeitskopie für Homebrew registrieren
        run: |
          tap_repository_full="$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f2)"
          tap_repository="$(printf '%s' "$tap_repository_full" | sed 's/^homebrew-//')"
          tap_name="$GITHUB_REPOSITORY_OWNER/$tap_repository"
          tap_path="$(brew --repository)/Library/Taps/$GITHUB_REPOSITORY_OWNER/homebrew-$tap_repository"
          mkdir -p "$tap_path"
          cp -R "$GITHUB_WORKSPACE/." "$tap_path/"
          brew trust --tap "$tap_name"

      - name: Formula-Stil und Audit prüfen
        run: |
          tap_repository_full="$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f2)"
          tap_repository="$(printf '%s' "$tap_repository_full" | sed 's/^homebrew-//')"
          tap_name="$GITHUB_REPOSITORY_OWNER/$tap_repository"
          brew style Formula/euer.rb
          brew style Formula/euer-datev.rb
          brew audit --tap="$tap_name" --formula

      - name: Formula installieren und testen
        run: |
          tap_repository_full="$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f2)"
          tap_repository="$(printf '%s' "$tap_repository_full" | sed 's/^homebrew-//')"
          tap_name="$GITHUB_REPOSITORY_OWNER/$tap_repository"
          brew install --build-from-source "$tap_name/euer"
          brew install --build-from-source "$tap_name/euer-datev"
          brew test "$tap_name/euer"
          brew test "$tap_name/euer-datev"
          "$(brew --prefix)/bin/euer" datev --help

  commit:
    name: Geprüfte Formula übernehmen
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Repository auschecken
        run: >-
          git clone --depth 1
          "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          .

      - name: Dieselben geprüften Formulas übernehmen
        uses: actions/download-artifact@v4
        with:
          name: updated-formulae
          path: Formula

      - name: Homebrew bereitstellen (Linux)
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      - name: Lokale Tap-Arbeitskopie für Homebrew registrieren
        run: |
          tap_repository_full="$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f2)"
          tap_repository="$(printf '%s' "$tap_repository_full" | sed 's/^homebrew-//')"
          tap_name="$GITHUB_REPOSITORY_OWNER/$tap_repository"
          tap_path="$(brew --repository)/Library/Taps/$GITHUB_REPOSITORY_OWNER/homebrew-$tap_repository"
          mkdir -p "$tap_path"
          cp -R "$GITHUB_WORKSPACE/." "$tap_path/"
          brew trust --tap "$tap_name"

      - name: Formula-Stil und Audit prüfen
        run: |
          tap_repository_full="$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f2)"
          tap_repository="$(printf '%s' "$tap_repository_full" | sed 's/^homebrew-//')"
          tap_name="$GITHUB_REPOSITORY_OWNER/$tap_repository"
          brew style Formula/euer.rb
          brew style Formula/euer-datev.rb
          brew audit --tap="$tap_name" --formula

      - name: Änderung mit eigenem Repository-Token übernehmen
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/euer.rb Formula/euer-datev.rb; then
            echo "Keine neue PyPI-Version vorhanden."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/euer.rb Formula/euer-datev.rb
          git commit -m "Update euer and euer-datev formulae"
          git push
